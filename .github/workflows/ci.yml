# Verification for every change.
#
# Two jobs rather than one, split by what a failure would *mean*:
#
#   `check` fails because of the commit under test. It is the gate.
#   `rolling` fails because Arch moved. It is a warning, and it runs on a
#   schedule so an OpenSSH update upstream cannot paint someone's unrelated
#   pull request red.
#
# That split matters here specifically: the strict hardening tier filters
# algorithm names against what the daemon reports, so a new OpenSSH release
# genuinely can change the outcome without a line of this repository changing.
# That signal is worth having — but as its own notification, not as noise on a
# contributor's branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Arch is a rolling image: this job exists to notice when upstream moves.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Nothing here writes to the repository; `release.yml` narrows separately for
# the one job that does. Stated rather than inherited, because the default is
# whatever the repository settings happen to be.
permissions:
  contents: read

# A second push to a branch makes the first run's answer irrelevant. Cancelling
# it matters more than usual here: each container job pulls Debian, Arch,
# Alpine and Rocky images and installs real packages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A misconfigured runner would otherwise skip every container test and
  # report success having verified nothing. See `require_docker!`.
  INITD_REQUIRE_DOCKER: "1"

jobs:
  # `deny.toml` calls itself the automated half of the dependency policy, and
  # was automated nowhere: it ran only when somebody remembered to. The
  # schedule above matters as much as the push trigger — a new advisory lands
  # against an unchanged `Cargo.lock`, which no push would ever notice.
  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check


  check:
    name: Format, lint, and test on Debian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rustup show` installs whatever `rust-toolchain.toml` pins — channel,
      # components and both musl targets. Installing `stable` and setting it as
      # the default would download a toolchain the pin then overrides, so the
      # log would name one compiler while another did the work.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The other published target, and the release profile, both of which were
      # otherwise first compiled on the day a tag was cut — the worst moment to
      # discover a cross-build or an LTO failure. A check rather than a build:
      # it catches what differs about the target without paying for codegen,
      # and `release.yml` still does the real build.
      - name: Check the other published target
        run: cargo check --all-targets --target aarch64-unknown-linux-musl

      - name: Check the release profile
        run: cargo check --release --all-targets

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # Subsumed by the container step below, and kept anyway: it needs no
      # Docker and finishes in seconds, so an ordinary logic error surfaces
      # without first waiting on image pulls and package installs.
      - name: Unit tests
        run: cargo nextest run

      # Both binaries the container tests bind-mount. Alpine has no glibc, so
      # its scenarios need the musl build — and they *skip* without it rather
      # than failing, which would leave this job green having covered one
      # family fewer. That is the failure this file's header warns about: a
      # step that runs less than it appears to.
      - name: Build the binaries the container tests mount
        run: |
          cargo build
          cargo build --target x86_64-unknown-linux-musl

      # Asserted rather than trusted: `require_runnable!` skips quietly, so
      # nothing downstream would report the absence.
      - name: Confirm the musl binary exists
        run: test -x target/x86_64-unknown-linux-musl/debug/initd

      # Everything except the Arch expansions, rather than "the Debian ones":
      # naming what to include silently drops any test belonging to neither
      # family — the matrix synchronisation check, the helpers' own tests —
      # and a filter that runs less than it appears to is the one CI defect
      # that looks exactly like success.
      # The systemd and old-client binaries are excluded because they have
      # their own job: they need capabilities a runner may refuse, and they are
      # slow enough to dominate this one.
      - name: Container tests (everything but the rolling image)
        run: |
          cargo nextest run --run-ignored all \
            -E 'not test(::arch) and not binary(integration_arch) and not binary(integration_systemd) and not binary(integration_old_client) and not binary(integration_tui)'

  rolling:
    name: Container tests on the rolling Arch image
    runs-on: ubuntu-latest
    # Never blocks a merge: this job speaks about upstream, not about the
    # commit. `check` is the gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Build the binary the container tests mount
        run: cargo build

      # Excludes the systemd and old-client binaries for the same reason the
      # gate does: those run in their own job, Arch expansions included.
      - name: Container tests (Arch only)
        run: |
          cargo nextest run --run-ignored all \
            -E '(test(::arch) or binary(integration_arch)) and not binary(integration_systemd) and not binary(integration_old_client) and not binary(integration_tui)'

  systemd:
    name: Container tests that need systemd as PID 1 or a second host
    runs-on: ubuntu-latest
    # Never blocks a merge. These need `--privileged` and `--cgroupns=host`,
    # which a runner is entitled to refuse; a host that will not grant them has
    # not found a bug, and the tests skip rather than fail there. Gating merges
    # on a capability outside the repository's control would make the suite
    # unusable the day a runner image tightens it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # The TUI scenarios expand across every image, Alpine included, so this
      # job needs the musl build as much as the gate does.
      - name: Build the binaries the container tests mount
        run: |
          cargo build
          cargo build --target x86_64-unknown-linux-musl

      # Two containers each, an init system booted per test, and package
      # installs inside both — far slower than the ephemeral scenarios, and
      # the reason they are their own binaries rather than part of the matrix.
      - name: systemd, TUI and old-client tests
        run: |
          cargo nextest run --run-ignored all \
            -E 'binary(integration_systemd) or binary(integration_old_client) or binary(integration_tui)' \
            --test-threads 2

  msrv:
    name: Build on the declared minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-version` in Cargo.toml is a claim about which compilers accept
      # this crate. Nothing enforces it, so it drifts the first time a newer
      # feature is used — and the failure would land on a user's machine.
      - name: Install the declared minimum
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "Declared MSRV: $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          echo "MSRV=$MSRV" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      # `cargo +TOOLCHAIN` rather than `rustup default`: `rust-toolchain.toml`
      # overrides the default, so setting one would have this job build with
      # the pinned channel while reporting the minimum. They agree today, and
      # the first time the pin moves ahead the job would pass without ever
      # having compiled against the version it names.
      - name: Check
        run: cargo "+$MSRV" check --all-targets
