# How the container scenarios are allowed to run.
#
# `--test-threads` bounds test *processes*, and the expensive thing here is not
# a process: it is a container, with a package manager inside it competing for
# the same network and the same disk as seven others. Measured, the difference
# is not marginal — `authorising_the_same_key_twice::rhel` takes 7.4s alone and
# has been seen past 300s in a full run, a forty-fold spread that is contention
# rather than work.

# Container scenarios, limited as a group.
#
# Eight is the number the project already runs with, and this makes it mean
# what it was assumed to mean: eight containers, not eight test binaries each
# free to start one. Unit tests are unaffected and keep the full thread count —
# there are a thousand of them and they cost microseconds.
[test-groups]
containers = { max-threads = 8 }

[[profile.default.overrides]]
# The scenarios that reach for Docker, which is not the same as everything in
# an `integration_*` binary: those binaries also hold the harness's own unit
# tests — `common::tests::a_container_that_never_started_is_a_panic_rather_than_an_answer`
# and its neighbours — which assert on helper logic and start nothing. They
# cost microseconds, and giving one a container slot would idle it.
#
# The Docker-using ones are exactly the `#[ignore]`d ones, which is what
# `test(/::/)` catches here: every scenario is generated per image and so
# carries a `::<image>` suffix, while the harness's own tests do not.
filter = 'binary(/^integration_/) and test(/::(alpine|arch|debian|leap|rhel|tumbleweed)$/)'
test-group = 'containers'

# Reported slow at a minute, killed at five.
#
# `slow-timeout` alone only prints SLOW; `terminate-after` is what ends a
# runaway. The multiplier is deliberately generous: openSUSE's sshd takes
# 111-122s to start under load — measured, and the reason the two-host harness
# waits 180s — so a ceiling tight enough to catch a hang would kill a scenario
# that was going to pass.
#
# What this bounds is the case where something is genuinely stuck: a container
# that never starts, a daemon that never listens. Five minutes of one scenario
# is not a slow test, it is a test nobody is learning anything from.
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
# Booting systemd is exempt, and learning why cost a release too — the same
# lesson as the entry below, in a second place, which is why both are written
# out rather than one being folded into the other.
#
# These scenarios boot systemd as PID 1 and wait for a unit to settle, which is
# the most expensive shape in the suite: a whole init system starting inside a
# container that is also installing packages. On 32 cores that is seconds; on
# the 2-core runner CI uses it is minutes.
#
# Measured, on `changing_the_port_leaves_the_service_healthy::rhel`:
#
#   -  8.8s  alone, locally
#   -  8.9s  with the other 35 systemd scenarios, locally
#   - >300s  on the runner, where it was killed
#
# A 34-fold spread with no change in what the scenario does. The proof that it
# is the runner rather than the test is its neighbour:
# `hardening_reloads_the_unit_without_stopping_it::rhel` **passed in 216s** in
# that same run, 84 seconds short of the ceiling, where it takes 37s here.
#
# Ten minutes rather than five. Not a figure anything should reach: it is
# roughly three times the slowest measurement on the slowest machine, so
# reaching it means stuck rather than slow — which is what the ceiling is for.
# The general five-minute ceiling stays for the other 1790 scenarios, where a
# runaway is worth catching sooner.
filter = 'binary(integration_systemd)'
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.default.overrides]]
# Preparing the images is exempt, and learning why cost a release.
#
# `prepare_the_images` builds all six, and building one means installing its
# packages: 25s on 32 cores, **over 300s on the 2-core runner CI uses**. Under
# the ceiling above it was killed at five minutes — and because it is what
# every other scenario's image depends on, killing it stranded them too. The
# run stopped after 16 of 1628 tests.
#
# The ceiling was right and its reach was wrong. It exists to catch a *test*
# that is stuck; this is preparation, which is allowed to take as long as the
# slowest package manager on the slowest machine needs. Half an hour is not a
# figure anyone should hit — it is far enough above the worst measurement that
# reaching it means something is broken rather than slow.
filter = 'test(=prepare_the_images)'
slow-timeout = { period = "120s", terminate-after = 15 }
# Not in the `containers` group either: it would hold one of the eight slots
# for the whole build while starting containers of its own.

# Retries are deliberately *not* set here.
#
# nextest would mark a recovered test FLAKY and count it as a pass, and this
# suite's flakiness has twice turned out to be a real defect: a wait that gave
# up before openSUSE's sshd answered, and a harness that read a container's
# stdout as an exit code. Both were found because a test failed and stayed
# failed. A retry would have hidden the first and made the second intermittent.
