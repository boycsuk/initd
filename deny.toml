# cargo-deny configuration.
#
# Every dependency is attack surface, and this tool runs as root on someone's
# server. Adding a dependency requires explicit confirmation (see CLAUDE.md);
# this file is the automated half of that policy.
#
# Run with: cargo deny check

[graph]
# Only the platforms initd actually ships on. Checking every target would
# report advisories for dependencies that are never compiled in.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# A known vulnerability or an unmaintained crate fails the build rather than
# printing a warning nobody reads.
yanked = "deny"
# Informational advisories default to `workspace`, which covers only *direct*
# dependencies — and this project has four of those against 182 crates in the
# lock, so the default was checking a fiftieth of what ships. It went unnoticed
# because the check still answered `advisories ok`: RUSTSEC-2026-0253, a
# use-after-free in `lru`, reached the binary through `ratatui` and was never
# counted, while `cargo audit` reported it all along. Both classes are set to
# `all` because a transitive crate is linked into the same static binary as a
# direct one.
unsound = "all"
unmaintained = "all"
ignore = []

[licenses]
# Permissive licences only. A copyleft dependency would impose its terms on a
# statically-linked binary, which is how initd is distributed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
]
# Refuse anything whose licence cannot be determined with high confidence.
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing is banned outright yet; entries go here when a specific crate turns
# out to be unwanted.
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
